    use: archive.extract
    with:
      from: package://tou-mira-x64
      to: staging://tou
      stripComponents: 1
  - id: copy-000
    use: file.copy
    with:
      from: "staging://tou/.doorstop_version"
      to: "game://.doorstop_version"
