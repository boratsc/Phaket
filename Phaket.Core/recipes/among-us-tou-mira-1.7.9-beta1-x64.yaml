schemaVersion: omrl/v0alpha1
id: community.github.town-of-us-mira
version: 1.7.9-beta1
metadata:
  title:
    pl-PL: Town of Us Mira
    en: Town of Us Mira
  description:
    pl-PL: Wydanie x64; warunek buildId dotyczy Steam. Nieznany build (np. Epic) blokuje instalację.
    en: x64 release; buildId gate uses Steam. An unknown build (e.g. Epic) blocks installation.
target:
  game: among-us
  systems: [windows, linux]
  editions:
    - store: steam
    - store: epic
    - store: msstore
when:
  all:
    - arch: x64
    - buildId: ">=25134893"
requires:
  capabilities: [archive.extract, file.copy, file.verify]
artifacts:
  - id: tou-mira-x64
    source: https://github.com/AU-Avengers/TOU-Mira/releases/download/1.7.9-beta1/TouMira.v1.7.9-beta1-x64-Steam-Epic-MsStore.zip
    sha256: b2e2163f7d0f41fb3cdf50352119925c42c80bc55a804507cf9e923aeb150afd
    arch: x64
    format: zip
steps:
