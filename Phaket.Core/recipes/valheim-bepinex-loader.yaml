    sha256: 6bca77b1016acfe0ffaebb6534c84b12ae8d12e5a96abbf59ec6e4526204fc6f
    sizeBytes: 726409
    format: zip
steps:
  - id: ensure-loader
    use: loader.ensure
    with:
      id: bepinex
      artifact: loader-pack
      version: 5.4.2360
      stripComponents: 1
verify:
  - use: file.verify
    with:
      path: game://BepInEx/core/BepInEx.dll
