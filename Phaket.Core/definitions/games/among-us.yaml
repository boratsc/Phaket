schemaVersion: game-definition/v0alpha1
slug: among-us
title:
  pl-PL: Among Us
  en: Among Us
storeIds:
  steam: "945360"
  epic: 963137e4c29d4c79a81323b8fab03a40
# Where the game's mods come from; consumed by the future Nexus client.
sources:
  thunderstore: among-us
  # api.nexusmods.com/v2/graphql game(domainName:"amongus") { id } — fetched 2026-11-25; 912 does not exist.
  nexus:
    domain: amongus
    gameId: 9589
detection:
  strategy: steam-manifest
mainExecutable: Among Us.exe
# Since v19.0.0 (2026.9.29) the Steam build is x64; older builds and itch are x86.
defaultArch: x64
# InnerSushi ships one Windows executable; under Proton on Linux the Windows depot
# is the correct artifact, so the download OS is the game's, never the host's.
platforms:
  - windows
writableAreas:
  - BepInEx/**
  - dotnet/**
  - CorsacCosmetics/**
  - winhttp.dll
  - doorstop_config.ini
  - .doorstop_version
  - changelog.txt
loaderLayouts:
  - id: bepinex
    variant: il2cpp
    entryFiles:
      - winhttp.dll
      - BepInEx/core/BepInEx.Unity.IL2CPP.dll
# Linux needs a Wine DLL override for the winhttp proxy DLL to load under
# Proton; Windows loads the proxy from the game directory by itself.
# Source: https://docs.bepinex.dev/articles/advanced/proton_wine.html (fetched 2026-11-13).
launchRequirements:
  - kind: dll-override
    name: winhttp.dll
    value: n,b
    status: required
    os:
      - linux
    source: https://docs.bepinex.dev/articles/advanced/proton_wine.html
    observedAt: "2026-11-13"
  - kind: env
    name: PROTON_NO_ESYNC
    value: "1"
    status: optional
    os:
      - linux
    source: https://github.com/scp222thj/MalumMenu (IL2CPP chainloader crash workaround)
    observedAt: "2026-11-13"
# PAK-141/146: one save tree, no per-account ambiguity: the profile is a single folder.
savePaths:
  - profile://steam/945360
# PAK-146 (model B), Unity/IL2CPP: on Linux the engine resolves ~/.config/unity3d/<company>/<game>
# through HOME/XDG_CONFIG_HOME, so a package launch can keep its saves beside itself. On Windows
# Unity asks SHGetKnownFolderPath for %USERPROFILE%\AppData\LocalLow, which no environment
# variable moves, so a package there shares the user's saves and is NOT parallel with vanilla.
savesIsolation:
  os:
    linux:
      mode: env
      env:
        - HOME
        - XDG_CONFIG_HOME
        - XDG_DATA_HOME
    windows:
      mode: shared
      reason: unity-locallow-known-folder
