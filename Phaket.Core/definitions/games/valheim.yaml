schemaVersion: game-definition/v0alpha1
slug: valheim
title:
  pl-PL: Valheim
  en: Valheim
storeIds:
  steam: "892970"
# Where the game's mods come from; consumed by the future Nexus client.
sources:
  thunderstore: valheim
  # api.nexusmods.com/v2/graphql game(domainName:"valheim") { id } — fetched 2026-11-25.
  nexus:
    domain: valheim
    gameId: 3667
detection:
  strategy: steam-manifest
mainExecutable: valheim.exe
# Valheim ships native Windows and Linux builds, and BepInExPack_Valheim is x64 only.
defaultArch: x64
writableAreas:
  # Real BepInExPack_Valheim 5.4.2360 installs these root files/directories.
  - BepInEx/**
  - winhttp.dll
  - doorstop_config.ini
  - .doorstop_version
  - doorstop_libs/**
  - start_game_bepinex.sh
  - start_server_bepinex.sh
  - changelog.txt
  - unstripped_corlib/**
loaderLayouts:
  - id: bepinex
    variant: mono
    entryFiles:
      - winhttp.dll
      - BepInEx/core/BepInEx.dll
# PAK-141/146: per-character folders under one profile root.
savePaths:
  - profile://steam/892970
# Where the GAME really keeps its saves; read once on Linux to seed a package (Windows: LocalLow
# cannot be redirected, so a package there shares the user's saves and seeds nothing).
saveLocations:
  os:
    linux:
      - "~/.config/unity3d/IronGate/Valheim"
# PAK-146 (model B), Unity: same rule as Among Us — HOME/XDG redirect works on Linux (worlds
# live under ~/.config/unity3d/IronGate/Valheim), while %USERPROFILE%\AppData\LocalLow comes
# from SHGetKnownFolderPath and cannot be redirected by environment on Windows.
savesIsolation:
  os:
    linux:
      mode: env
      env:
        - HOME
        - XDG_CONFIG_HOME
        - XDG_DATA_HOME
    windows:
      mode: shared
      reason: unity-locallow-known-folder
# PAK-146 C: Windows follows the shared-saves rule. Linux direct launch stays absent (Unknown)
# until a real two-instance test verifies it; steam:// is always steam-single-instance.
parallelLaunch:
  os:
    windows:
      status: not-supported
      reason: shared-saves
