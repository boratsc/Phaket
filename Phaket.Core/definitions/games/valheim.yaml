schemaVersion: game-definition/v0alpha1
slug: valheim
title:
  pl-PL: Valheim
  en: Valheim
storeIds:
  steam: "892970"
# Where the game's mods come from; consumed by the future Nexus client.
sources:
  thunderstore: valheim
  # api.nexusmods.com/v2/graphql game(domainName:"valheim") { id } — fetched 2026-11-25.
  nexus:
    domain: valheim
    gameId: 3667
detection:
  strategy: steam-manifest
mainExecutable: valheim.exe
# Valheim ships native Windows and Linux builds, and BepInExPack_Valheim is x64 only.
defaultArch: x64
writableAreas:
  # Real BepInExPack_Valheim 5.4.2360 installs these root files/directories.
  - BepInEx/**
  - winhttp.dll
  - doorstop_config.ini
  - .doorstop_version
  - doorstop_libs/**
  - start_game_bepinex.sh
  - start_server_bepinex.sh
  - changelog.txt
  - unstripped_corlib/**
loaderLayouts:
  - id: bepinex
    variant: mono
    entryFiles:
      - winhttp.dll
      - BepInEx/core/BepInEx.dll
