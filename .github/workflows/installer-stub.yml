name: Installer stub (PhaketSetup.exe)

# Uruchamianie RĘCZNE i rzadkie — artefakt pod stałym URL-em nie zmienia się przy wydaniach aplikacji.
# Stub (PAK-114) pobiera z https://phaket.app/api/releases?channel=release najnowszą paczkę, sprawdza
# SHA-256 i uruchamia Phaket-Setup.exe z feedu (albo seed-install, gdy manifest nie ma Setup.exe).
# Publish: NativeAOT win-x64, twardy limit rozmiaru 4,9 MB (PublishSizeLimitBytes w csproj).
# UI: jedno okno Win32 przez P/Invoke (bez WinForms/WinUI/XAML) + fallback konsolowy.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Wgraj artefakt na serwer (wymaga sekretów DEPLOY_*)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  ARTIFACT: PhaketSetup.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # AOT linkuje z MSVC — runner windows-latest ma zainstalowany "Desktop development with C++".
      - name: Test stub logic
        run: dotnet test installer/Phaket.InstallerStub.Tests/Phaket.InstallerStub.Tests.csproj -c Release

      - name: Publish AOT (win-x64)
        run: dotnet publish installer/Phaket.InstallerStub.Win32/Phaket.InstallerStub.Win32.csproj -c Release -o out/stub

      - name: Check size (<5 MB)
        shell: pwsh
        run: |
          $exe = Get-Item "out/stub/$env:ARTIFACT"
          "Rozmiar: {0:N0} B ({1:N2} MB)" -f $exe.Length, ($exe.Length / 1MB)
          if ($exe.Length -ge 5MB) { throw "PhaketSetup.exe przekracza 5 MB: $($exe.Length)" }

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: phaket-setup-stub
          path: out/stub/PhaketSetup.exe
          if-no-files-found: error

  deploy:
    # Opt-in: tylko z inputem deploy=true; wymaga sekretów DEPLOY_* (patrz release.yml).
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v5
        with:
          name: phaket-setup-stub

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload stub
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          # Stała ścieżka pliku — instalatory i strona mogą linkować bez zmian przy każdym wydaniu aplikacji.
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p /srv/synapsekit-boracik/nginx/html/phaket/download"
          scp -i ~/.ssh/deploy PhaketSetup.exe \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/synapsekit-boracik/nginx/html/phaket/download/PhaketSetup.exe"