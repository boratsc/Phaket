# =============================================================================================
# URUCHOMIENIE TEGO WORKFLOW JEST WYDANIEM I WYMAGA WYRAŹNEJ ZGODY WŁAŚCICIELA.
# =============================================================================================
# Źródło prawdy nazw: serwer PAK-110 (PhaketServer/Phaket.Api/Releases.cs). Kontrakt:
#   GET /api/releases?channel=<release|beta>&os=<win|linux>  →  {success, latestVersion,
#   downloadBaseUrl, releases[{Version, File, SHA256}]}  czytane z  releases.<channel>.<os>.json
#   (tylko kanały release/beta; File to sama nazwa pliku, bez ścieżek).
# Kolejność: build+test obu projektów aplikacji (Linux i Windows) → vpk pack (Setup/Portable na
# windows-latest, AppImage na ubuntu) → SHA256SUMS.txt → draft GitHub Release z paczkami per OS →
# deploy po SSH/SCP (paczki kanału, potem manifest releases.<channel>.<os>.json) → publikacja release.
# Promocja beta→prod = to samo uruchomienie z channel=release (bez kopiowania plików między kanałami).
# Bez podpisów kodu (brak certyfikatu, decyzja 25.11.2026) i bez ogłoszeń Discord.
#
# ==== publishTarget (co robi przebieg) =======================================================
#   none              = tylko build+test i artefakty Actions; bez draftu, bez serwera.
#   github-draft      = j.w. + draft GitHub Release (zostaje draftem — publikacja ręczna);
#                       NIE dotyka serwera.
#   github-draft+server = draft + deploy na serwer + `gh release edit --draft=false` na końcu.
#
# ==== Konfiguracja (działanie właściciela repo — workflow NIE zakłada, że to istnieje) ==========
# Sekrety (Settings → Secrets and variables → Actions → Secrets):
#   1. Utwórz klucz SSH do deployu:        ssh-keygen -t ed25519 -C phaket-ci -f phaket-ci -N ""
#   2. Klucz publiczny dodaj na serwerze:  ~debian/.ssh/authorized_keys
#   3. Wklej klucz prywatny jako base64:   base64 -w0 phaket-ci | ... → sekret DEPLOY_SSH_PRIVATE_KEY
# Variables (… → Variables):
#   4. DEPLOY_HOST = vps-b99a39c3.vps.ovh.net, DEPLOY_USER = debian
#   5. (opcjonalnie) RELEASES_DOWNLOAD_BASE_URL = publiczny prefiks paczek; workflow przekazuje go
#      do generacji manifestu TYLKO jako weryfikację, że odpowiada kanałowi przebiegu — serwer
#      czyta własną wartość z .env compose (domyślnie https://phaket.app/releases/).
# Uprawnienia: GITHUB_TOKEN wystarcza do draft release (contents: write); brak sekretów płatnych.
#
# Struktura katalogów na serwerze (volumeny z PhaketServer/compose.yaml; kanon: README serwera):
#   releases_packages:/usr/share/nginx/html/releases/<channel>/<os>/      ← paczki i Phaket-Setup.exe
#   releases_manifests:/data/releases/releases.<channel>.<os>.json        ← czytane przez /api/releases
#   Stąd URL pobrania = https://phaket.app/releases/<channel>/<os>/<File> (downloadBaseUrl kończy się
#   na /releases/, więc File w manifeście MUSI być względne wobec katalogu kanału).
# Volumeny Dockera nie są katalogami hosta: skrypty scripts/server-deploy.py kopiują pliki przez
# `docker cp` w repozytorium serwera (~/PhaketServer). Plik trafia PRZED manifestem.
# =============================================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja wydania, np. 0.1.0 lub 0.1.1-beta.1 (wymagana)'
        required: true
        type: string
      channel:
        description: 'Kanał aktualizacji (serwer zna tylko te dwa)'
        required: true
        type: choice
        options: [beta, release]
        default: beta
      publishTarget:
        description: 'Co opublikować na końcu'
        required: true
        type: choice
        options: [github-draft+server, github-draft, none]
        default: none

# Dwa przebiegi naraz nie mogą mieszać tego samego kanału na serwerze.
concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: write   # draft release + upload paczek

env:
  VPK_VERSION: 1.2.161
  SERVER_ROOT: ~/PhaketServer
  # Katalog paczek w manifeście; musi zgadzać się z RELEASES_DOWNLOAD_BASE_URL serwera.
  DOWNLOAD_BASE_URL: ${{ vars.RELEASES_DOWNLOAD_BASE_URL || 'https://phaket.app/releases/' }}
  # Instalator-stub (PAK-114) czyta go z feedu; nginx prod musi serwować go z /download/ (§6 runbooka).
  STUB_URL: https://phaket.app/download/PhaketSetup.exe

jobs:
  # Wersja i kanał przychodzą ręcznie: bez tej bramki da się wydać release 0.1.1-beta.1
  # (Velopack oznaczy go jako prerelease, a manifest release wskaże build bety).
  validate:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ inputs.version }}
    steps:
      - name: Version matches the channel
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::Wersja '$VERSION' nie jest semver 0.1.1 lub 0.1.1-beta.1"; exit 1; }
          prerelease=0; [[ "$VERSION" == *-* ]] && prerelease=1
          [[ "$CHANNEL" == beta ]] && want=1 || want=0
          [[ "$prerelease" == "$want" ]] || {
            echo "::error::Kanał $CHANNEL wymaga wersji $([[ $want == 1 ]] && echo 'z przyrostkiem -beta' || echo 'bez przyrostka prerelease')"; exit 1; }

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      # Build+test PRZED pakowaniem: wydanie nie może powstać z kodu, który nie przechodzi testów.
      - name: Build and test
        run: |
          dotnet restore Phaket.slnx
          dotnet build Phaket.slnx -c Release --no-restore
          dotnet test Phaket.slnx -c Release --no-build --no-restore

      - name: Install vpk
        shell: bash
        run: dotnet tool install --tool-path .vpk vpk --version "$VPK_VERSION"

      - name: Publish win-x64
        shell: bash
        run: dotnet publish Phaket/Phaket.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      - name: Pack Setup.exe and Portable.zip
        shell: bash
        run: >
          .vpk/vpk.exe pack
          -u Phaket -v "${{ inputs.version }}"
          --packDir publish/win-x64 --mainExe Phaket.exe
          --icon Phaket/Assets/brand/phaket-app-icon.ico
          --packTitle Phaket --packAuthors "Bartosz Gradzik"
          --outputDir releases/win-x64 --runtime win-x64

      # Kanał należy do serwera (release/beta), nie do paczki: bez --channel vpk używa "win".
      # Setup.exe jedzie do feedu pod stałą nazwą, bo stub instalatora (PAK-114) szuka
      # wpisu "Phaket-Setup.exe" w releases[] i uruchamia go po weryfikacji SHA-256. Plik jest
      # per kanał (katalog /releases/<channel>/win/), więc Setup.exe bety nie nadpisze stabilnego.
      - name: Name the installer for the feed
        shell: bash
        run: |
          cd releases/win-x64
          setup=$(find releases/win-x64 -maxdepth 1 -name 'Phaket-*-Setup.exe' -print -quit)
          [[ -n "$setup" ]] || { echo "vpk nie utworzył Setup.exe" >&2; exit 1; }
          mv "$setup" Phaket-Setup.exe

      - name: SHA256SUMS (Windows)
        shell: bash
        run: |
          cd releases/win-x64
          sha256sum -- * > SHA256SUMS.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: phaket-win-x64-${{ inputs.channel }}
          path: releases/win-x64
          if-no-files-found: error

  build-linux:
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Install vpk and AppImage tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools file
          dotnet tool install --tool-path .vpk vpk --version "$VPK_VERSION"

      - name: Publish linux-x64
        shell: bash
        run: dotnet publish Phaket/Phaket.csproj -c Release -r linux-x64 --self-contained true -o publish/linux-x64

      # Velopack 1.2.161: AppImage wymaga --icon; --categories domyślnie Utility (podajemy jawnie);
      # --compression gzip (domyślne, najszybsze rozpakowanie; xz mniejszy, ale wolniejszy start).
      - name: Pack AppImage
        shell: bash
        run: >
          .vpk/vpk pack
          -u Phaket -v "${{ inputs.version }}"
          --packDir publish/linux-x64 --mainExe Phaket
          --icon Phaket/Assets/brand/phaket-sygnet-512.png
          --categories Utility
          --compression gzip
          --packTitle Phaket --packAuthors "Bartosz Gradzik"
          --outputDir releases/linux-x64 --runtime linux-x64

      - name: SHA256SUMS (Linux)
        shell: bash
        run: |
          cd releases/linux-x64
          sha256sum -- * > SHA256SUMS.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: phaket-linux-x64-${{ inputs.channel }}
          path: releases/linux-x64
          if-no-files-found: error

  draft-release:
    needs: [validate, build-windows, build-linux]
    if: ${{ inputs.publishTarget != 'none' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v5
        with:
          path: assets
          pattern: phaket-*
          merge-multiple: true

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --draft --title "Phaket ${{ inputs.version }}" \
            --notes "Kanał: ${{ inputs.channel }}. Sumy kontrolne: SHA256SUMS.txt. Instalator: $STUB_URL (Windows, zawsze stabilny kanał), paczka portable w załącznikach." \
            assets/*

  # Tylko pełne wydanie dotyka serwera: github-draft zostawia draft GitHub bez deployu.
  deploy:
    needs: [validate, build-windows, build-linux, draft-release]
    if: ${{ inputs.publishTarget == 'github-draft+server' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v5
        with:
          path: assets
          pattern: phaket-*
          merge-multiple: true

      # Jedno źródło prawdy dla workflow i serwera: katalog paczek musi być katalogiem kanału,
      # bo File w manifeście jest doklejane do downloadBaseUrl.
      - name: Check the download base URL matches the channel
        env:
          EXPECTED: https://phaket.app/releases/${{ inputs.channel }}/
        run: |
          base=${DOWNLOAD_BASE_URL%/}
          [[ "$base/" == "$EXPECTED" ]] || {
            echo "::error::DOWNLOAD_BASE_URL=$base/ nie jest katalogiem kanału ${{ inputs.channel }} ($EXPECTED)"; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release files to the server volumes
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          CHANNEL: ${{ inputs.channel }}
          SERVER_ROOT: ${{ env.SERVER_ROOT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 $SERVER_ROOT/scripts/server-deploy.py --channel $CHANNEL --stage-dir $SERVER_ROOT/staging" < /dev/null
          # Paczki i instalatory kanału (bez --delete: feed trzyma poprzednie wersje), bez SHA256SUMS.txt.
          for os in win linux; do
            rsync -az --exclude SHA256SUMS.txt -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" \
              "assets/$os-x64"/ "$DEPLOY_USER@$DEPLOY_HOST:$SERVER_ROOT/staging/$os/"
          done
          # Manifesty z tych samych paczek, które zaraz trafią na serwer (Setup.exe bierze wersję wydania);
          # kolejność wydań liczy serwer.
          for os in win linux; do
            python3 scripts/feed-manifest.py --version "${{ inputs.version }}" \
              --out "manifests/releases.$CHANNEL.$os.json" staging/$os/*
          done
          rsync -az -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" manifests/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$SERVER_ROOT/staging/manifests/"

      # Plik w wolumenie paczek PRZED manifestem; przerwany deploy zostawia stary manifest, więc
      # użytkownik nie dostanie 404 na brakującej paczce. --clean czyści katalog staging.
      - name: Commit release into the server volumes
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          CHANNEL: ${{ inputs.channel }}
          SERVER_ROOT: ${{ env.SERVER_ROOT }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 $SERVER_ROOT/scripts/server-deploy.py --channel $CHANNEL --stage-dir $SERVER_ROOT/staging --clean" < /dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ inputs.version }}" --draft=false